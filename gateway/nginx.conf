# Rendered as an nginx template (see docker-compose.yml); OIDC_CSP_ORIGIN is
# exported by oidc-csp.envsh.
map $http_origin $cors_origin {
    default "";
    "http://localhost:9100" $http_origin;
    "http://localhost:5173" $http_origin;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server_tokens off;

    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${OIDC_CSP_ORIGIN}; frame-src 'self' ${OIDC_CSP_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "false" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PUT" always;
    add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Correlation-ID,Idempotency-Key,X-Workflow-Worker-Protocol-Version" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Vary "Origin" always;

    set $workflow_frontend_upstream frontend:80;
    set $workflow_backend_upstream app:8080;
    set $workflow_query_upstream workflow-query:8081;

    location = /livez {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /readyz {
        proxy_pass http://$workflow_frontend_upstream/readyz;
        proxy_set_header Host $http_host;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://$workflow_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Command Service API
    # Route: /api/instances -> http://app:8080/instances
    # Authoritative, checked-in HTTP contract (mounted read-only by Compose).
    location = /api/openapi.yaml {
        alias /usr/share/nginx/html/openapi.yaml;
        default_type application/yaml;
        add_header Cache-Control "no-cache";
    }

    # Operational counters are private service-to-service endpoints.
    location = /api/internal/metrics {
        return 404;
    }
    location = /api/v1/internal/metrics {
        return 404;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        limit_req zone=api_per_ip burst=40 nodelay;
        # Strip /api/ prefix if the backend doesn't expect it, 
        # BUT our backend router usually mounts on / or specific paths. 
        # Let's assume we strip it.
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://$workflow_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Query Service API
    # Versioned route: /api/v1/query/instances -> workflow-query /v1/instances
    location /api/v1/query/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        limit_req zone=api_per_ip burst=40 nodelay;
        rewrite ^/api/v1/query/(.*) /v1/$1 break;

        proxy_pass http://$workflow_query_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Route: /api/query/instances -> http://workflow-query:8081/instances
    location /api/query/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        limit_req zone=api_per_ip burst=40 nodelay;
        rewrite ^/api/query/(.*) /$1 break;
        
        proxy_pass http://$workflow_query_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

}
