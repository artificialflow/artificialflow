name: Release Docker Images

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        type: string
      publish:
        description: Publish images instead of running a dry-run build
        required: true
        type: boolean
      promote:
        description: Promote tested candidates after protected approval
        required: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: v1.2.0
      publish:
        description: Publish images instead of running a dry-run build
        required: true
        default: false
        type: boolean
      promote:
        description: Direct promotion is disabled; use the Release orchestrator
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-images-${{ inputs.tag }}-${{ inputs.publish }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"

      - name: Validate branding, version, and alias workflow
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/validate_legacy_branding.mjs
          node scripts/validate_release_version.mjs
          node scripts/validate_release_workflows.mjs
          if [[ "${{ inputs.promote }}" == "true" && "${{ inputs.publish }}" != "true" ]]; then
            echo "promotion requires a published immutable candidate" >&2
            exit 1
          fi

  docker-images:
    name: Build, scan, promote, sign, and verify images
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: workflow-command
            dockerfile: backend/Dockerfile
            context: .
          - name: workflow-runtime
            dockerfile: backend/Dockerfile.runtime
            context: .
          - name: workflow-query
            dockerfile: backend/Dockerfile.workflow-query
            context: .
          - name: sync-worker
            dockerfile: backend/Dockerfile.sync-worker
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and deterministic candidate
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a v-prefixed semantic version: ${tag}" >&2
            exit 1
          fi
          candidate_tag="candidate-${tag}-${GITHUB_SHA}"
          {
            echo "tag=${tag}"
            echo "candidate_tag=${candidate_tag}"
            echo "candidate_reference=docker.io/artificialflow/${{ matrix.image.name }}:${candidate_tag}"
            echo "publish=${{ inputs.publish }}"
            echo "revision=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Registry reads happen only after authentication so authorization and
      # transport failures cannot be mistaken for an available tag.
      - name: Login to Docker Hub
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Inspect deterministic candidate
        id: candidate
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            local reference="$1"
            local output status
            set +e
            output="$(docker buildx imagetools inspect "${reference}" \
              --format '{{printf "%s" .Manifest.Digest}}' 2>&1)"
            status=$?
            set -e
            if [[ ${status} -eq 0 ]]; then
              if [[ ! "${output}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "registry returned an invalid digest for ${reference}: ${output}" >&2
                return 2
              fi
              INSPECTED_DIGEST="${output}"
              return 0
            fi
            if [[ "${output}" == *"manifest unknown"* ||
                  "${output}" == *"MANIFEST_UNKNOWN"* ||
                  "${output}" == *": not found"* ||
                  "${output}" == *"no such manifest"* ]]; then
              return 1
            fi
            echo "operational failure inspecting ${reference}: ${output}" >&2
            return 2
          }

          reference="${{ steps.version.outputs.candidate_reference }}"
          if inspect_digest "${reference}"; then
            {
              echo "exists=true"
              echo "digest=${INSPECTED_DIGEST}"
            } >> "${GITHUB_OUTPUT}"
            echo "reusing candidate ${reference}@${INSPECTED_DIGEST}"
          else
            status=$?
            if [[ ${status} -ne 1 ]]; then
              exit "${status}"
            fi
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "candidate manifest does not exist yet: ${reference}"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/artificialflow/${{ matrix.image.name }}
          tags: type=raw,value=${{ steps.version.outputs.tag }}

      # A publish build writes only the deterministic candidate. No immutable
      # release tag exists until the exact candidate digest has passed Trivy.
      - name: Build candidate once
        id: build
        if: ${{ steps.version.outputs.publish != 'true' || steps.candidate.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.publish == 'true' }}
          tags: ${{ steps.version.outputs.candidate_reference }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            REVISION=${{ steps.version.outputs.revision }}
          sbom: true
          provenance: true

      - name: Resolve candidate digest
        id: artifact
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.candidate.outputs.exists }}" == "true" ]]; then
            digest="${{ steps.candidate.outputs.digest }}"
          else
            digest="${{ steps.build.outputs.digest }}"
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate build did not produce a valid digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Scan candidate digest
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: docker.io/artificialflow/${{ matrix.image.name }}@${{ steps.artifact.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign for candidate verification
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify immutable candidate
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        shell: bash
        run: |
          set -euo pipefail
          candidate="docker.io/artificialflow/${{ matrix.image.name }}@${{ steps.artifact.outputs.digest }}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign sign --yes "${candidate}"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${candidate}"
          test "$(docker buildx imagetools inspect "${candidate}" --format '{{json .SBOM}}')" != "null"
          test "$(docker buildx imagetools inspect "${candidate}" --format '{{json .Provenance}}')" != "null"

      - name: Promote scanned digest to immutable final references
        if: ${{ steps.version.outputs.publish == 'true' && inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            local reference="$1"
            local output status
            set +e
            output="$(docker buildx imagetools inspect "${reference}" \
              --format '{{printf "%s" .Manifest.Digest}}' 2>&1)"
            status=$?
            set -e
            if [[ ${status} -eq 0 ]]; then
              if [[ ! "${output}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "registry returned an invalid digest for ${reference}: ${output}" >&2
                return 2
              fi
              INSPECTED_DIGEST="${output}"
              return 0
            fi
            if [[ "${output}" == *"manifest unknown"* ||
                  "${output}" == *"MANIFEST_UNKNOWN"* ||
                  "${output}" == *": not found"* ||
                  "${output}" == *"no such manifest"* ]]; then
              return 1
            fi
            echo "operational failure inspecting ${reference}: ${output}" >&2
            return 2
          }

          candidate_digest="${{ steps.artifact.outputs.digest }}"
          source="docker.io/artificialflow/${{ matrix.image.name }}@${candidate_digest}"
          tag="${{ steps.version.outputs.tag }}"
          version_tag="${tag#v}"
          final_tags=()
          moving_minor_tag=""
          add_tag() {
            local candidate="$1" existing
            for existing in "${final_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            final_tags+=("${candidate}")
          }
          add_tag "${tag}"
          add_tag "${version_tag}"
          if [[ "${version_tag}" != *-* && "${version_tag}" =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            moving_minor_tag="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            add_tag "${moving_minor_tag}"
          fi

          for repository in artificialflow azizaltaleb; do
            for final_tag in "${final_tags[@]}"; do
              reference="docker.io/${repository}/${{ matrix.image.name }}:${final_tag}"
              if inspect_digest "${reference}"; then
                if [[ "${INSPECTED_DIGEST}" != "${candidate_digest}" ]]; then
                  if [[ "${final_tag}" != "${moving_minor_tag}" ]]; then
                    echo "immutable release tag mismatch: ${reference} is ${INSPECTED_DIGEST}, candidate is ${candidate_digest}" >&2
                    exit 1
                  fi
                  echo "updating moving minor alias ${reference} from ${INSPECTED_DIGEST} to ${candidate_digest}"
                else
                  echo "verified idempotent existing reference ${reference}@${candidate_digest}"
                  continue
                fi
              else
                status=$?
                if [[ ${status} -ne 1 ]]; then
                  exit "${status}"
                fi
              fi
              docker buildx imagetools create --tag "${reference}" "${source}"
              if ! inspect_digest "${reference}"; then
                echo "promoted reference could not be inspected: ${reference}" >&2
                exit 1
              fi
              if [[ "${INSPECTED_DIGEST}" != "${candidate_digest}" ]]; then
                echo "promotion changed digest for ${reference}: ${INSPECTED_DIGEST}" >&2
                exit 1
              fi
            done
          done

      - name: Verify canonical and legacy final manifest digests
        if: ${{ steps.version.outputs.publish == 'true' && inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.artifact.outputs.digest }}"
          canonical_digest="$(docker buildx imagetools inspect \
            "docker.io/artificialflow/${{ matrix.image.name }}:${{ steps.version.outputs.tag }}" \
            --format '{{printf "%s" .Manifest.Digest}}')"
          legacy_digest="$(docker buildx imagetools inspect \
            "docker.io/azizaltaleb/${{ matrix.image.name }}:${{ steps.version.outputs.tag }}" \
            --format '{{printf "%s" .Manifest.Digest}}')"
          test "${canonical_digest}" = "${expected}"
          test "${legacy_digest}" = "${canonical_digest}"

      - name: Install Cosign
        if: ${{ steps.version.outputs.publish == 'true' && inputs.promote }}
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify canonical and legacy references
        if: ${{ steps.version.outputs.publish == 'true' && inputs.promote }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.artifact.outputs.digest }}"
          canonical="docker.io/artificialflow/${{ matrix.image.name }}@${digest}"
          legacy="docker.io/azizaltaleb/${{ matrix.image.name }}@${digest}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign sign --yes "${canonical}"
          cosign sign --yes "${legacy}"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${canonical}"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${legacy}"

  candidate-lock:
    name: Record immutable candidate image set
    needs: docker-images
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write candidate digest lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          release_tag="${{ inputs.tag }}"
          candidate_tag="candidate-${release_tag}-${GITHUB_SHA}"
          : > /tmp/images.tsv
          for image in workflow-command workflow-runtime workflow-query sync-worker frontend; do
            repository="docker.io/artificialflow/${image}"
            digest="$(docker buildx imagetools inspect "${repository}:${candidate_tag}" --format '{{printf "%s" .Manifest.Digest}}')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            printf '%s\t%s\t%s\n' "${image}" "${repository}" "${digest}" >> /tmp/images.tsv
          done
          : > /tmp/dependencies.tsv
          while IFS=$'\t' read -r name repository dependency_tag; do
            digest="$(docker buildx imagetools inspect "${repository}:${dependency_tag}" --format '{{printf "%s" .Manifest.Digest}}')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            printf '%s\t%s\t%s\n' "${name}" "${repository}" "${digest}" >> /tmp/dependencies.tsv
          done <<'DEPENDENCIES'
          gateway	docker.io/nginxinc/nginx-unprivileged	1.27-alpine
          postgresql	docker.io/library/postgres	15-alpine
          kafka	docker.io/confluentinc/cp-kafka	7.6.1
          debezium-connect	docker.io/debezium/connect	2.6
          elasticsearch	docker.elastic.co/elasticsearch/elasticsearch	8.11.1
          DEPENDENCIES
          tree_sha="$(python3 scripts/release/evidence.py candidate-identity | python3 -c 'import json,sys; print(json.load(sys.stdin)["candidateTreeSha256"])')"
          python3 - "${release_tag}" "${GITHUB_SHA}" "${tree_sha}" /tmp/images.tsv /tmp/dependencies.tsv > reports/candidate-images.json <<'PY'
          import json, sys
          def load(path):
              result=[]
              for line in open(path, encoding="utf-8"):
                  name, repository, digest=line.rstrip("\n").split("\t")
                  result.append({"name":name, "repository":repository, "digest":digest,
                                 "platforms":["linux/amd64","linux/arm64"]})
              return result
          print(json.dumps({"schemaVersion":1, "tag":sys.argv[1],
                            "commitSha":sys.argv[2], "candidateTreeSha256":sys.argv[3],
                            "images":load(sys.argv[4]),
                            "dependencies":load(sys.argv[5])}, indent=2))
          PY

      - name: Upload candidate image lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-images-${{ inputs.promote }}
          path: reports/candidate-images.json
          if-no-files-found: error
          retention-days: 365

  verify-release-set:
    name: Verify complete canonical and legacy image set
    needs: [docker-images, candidate-lock]
    if: ${{ inputs.promote }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        if: ${{ inputs.publish }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify all transition aliases
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          for image in workflow-command workflow-runtime workflow-query sync-worker frontend; do
            canonical_digest="$(docker buildx imagetools inspect \
              "docker.io/artificialflow/${image}:${{ inputs.tag }}" \
              --format '{{printf "%s" .Manifest.Digest}}')"
            legacy_digest="$(docker buildx imagetools inspect \
              "docker.io/azizaltaleb/${image}:${{ inputs.tag }}" \
              --format '{{printf "%s" .Manifest.Digest}}')"
            test "${legacy_digest}" = "${canonical_digest}"
            echo "${image} ${canonical_digest}"
          done
