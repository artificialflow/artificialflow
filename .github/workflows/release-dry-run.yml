name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "v1.7.7"

jobs:
  release-dry-run:
    name: Validate release candidate locally
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/nodejs-sdk/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Run release dry run
        env:
          VERSION: 1.2.0-dry-run
          REVISION: ${{ github.sha }}
        run: bash scripts/release_dry_run.sh
