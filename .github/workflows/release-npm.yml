name: Release Node.js SDK

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag that must match the package version
        required: true
        type: string
      publish:
        description: Publish to npm instead of running validation only
        required: true
        type: boolean
      images_verified:
        description: The required image reusable workflow completed successfully
        required: true
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate
        required: true
        default: v1.2.0
      publish:
        description: Direct publication is refused; use the Release orchestrator
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm-${{ inputs.tag }}-${{ inputs.publish }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate release identity and orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Refuse npm publication without completed image workflow
        if: ${{ inputs.publish && !inputs.images_verified }}
        run: |
          echo "npm publication must run through .github/workflows/release.yml after the image workflow succeeds" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"

      - name: Validate branding, version, and publication order
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/validate_legacy_branding.mjs
          node scripts/validate_release_version.mjs
          node scripts/validate_release_workflows.mjs
          node scripts/validate_nodejs_sdk_package.mjs

  publish-nodejs-sdk:
    name: Publish @artificialflow/nodejs-sdk
    needs: release-preflight
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        working-directory: clients/nodejs-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: clients/nodejs-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and distribution tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ inputs.tag }}"
          tag_version="${tag#v}"
          test "${tag_version}" = "${version}" || {
            echo "tag ${tag} does not match package version ${version}" >&2
            exit 1
          }
          if [[ "${version}" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          {
            echo "version=${version}"
            echo "dist_tag=${dist_tag}"
            echo "publish=${{ inputs.publish }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Refuse existing exact npm versions
        if: ${{ steps.release.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          for package in @artificialflow/nodejs-sdk; do
            set +e
            result="$(npm view "${package}@${version}" version --json 2>&1)"
            status=$?
            set -e
            if [[ ${status} -eq 0 ]]; then
              echo "exact npm version already exists: ${package}@${version}" >&2
              exit 1
            fi
            if [[ "${result}" != *"E404"* && "${result}" != *"404 Not Found"* ]]; then
              echo "could not verify npm version availability for ${package}@${version}" >&2
              echo "${result}" >&2
              exit "${status}"
            fi
          done

      - name: Test
        run: npm test

      - name: Validate package metadata
        run: npm run validate:package

      - name: Package dry run
        run: npm pack --dry-run

      - name: Pack immutable package candidate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --json > npm-pack.json
          filename="$(node -p "require('./npm-pack.json')[0].filename")"
          integrity="$(node -p "require('./npm-pack.json')[0].integrity")"
          sha256="$(shasum -a 256 "${filename}" | awk '{print $1}')"
          {
            echo "filename=${filename}"
            echo "integrity=${integrity}"
            echo "sha256=${sha256}"
          } >> "${GITHUB_OUTPUT}"
          node - "${{ steps.release.outputs.version }}" "${integrity}" "${sha256}" <<'NODE' > candidate-packages.json
          const [version, integrity, sha256] = process.argv.slice(2);
          console.log(JSON.stringify({
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            packages: [{
              name: "@artificialflow/nodejs-sdk",
              version,
              integrity,
              tarballSha256: sha256
            }]
          }, null, 2));
          NODE

      - name: Validate generated protobuf drift
        working-directory: .
        run: bash scripts/validate_generated_proto.sh

      - name: Validate clean canonical installation
        working-directory: .
        run: bash scripts/validate_nodejs_sdk_install.sh

      - name: Generate package SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > artificialflow-nodejs-sdk-sbom.cdx.json

      - name: Upload package SBOM
        uses: actions/upload-artifact@v4
        with:
          name: artificialflow-nodejs-sdk-sbom
          path: clients/nodejs-sdk/artificialflow-nodejs-sdk-sbom.cdx.json
          if-no-files-found: error
          retention-days: 365

      - name: Upload candidate package lock and bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-packages
          path: |
            clients/nodejs-sdk/candidate-packages.json
            clients/nodejs-sdk/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 365

      - name: Publish
        if: ${{ steps.release.outputs.publish == 'true' }}
        run: npm publish "${{ steps.package.outputs.filename }}" --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

