name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "v1.7.7"

jobs:
  workflow-validation:
    name: Workflow and Agentic Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Validate GitHub workflows
        run: actionlint -color=false

      - name: Validate rename and release contracts
        run: |
          node scripts/validate_legacy_branding.mjs
          node scripts/validate_transition_compatibility.mjs
          node scripts/validate_release_version.mjs
          node scripts/validate_release_workflows.mjs
          python3 scripts/release/evidence.py validate-manifest
          python3 scripts/release/test_evidence.py
          python3 scripts/release/test_upstream_images.py
          bash -n scripts/release/*.sh scripts/quality/*.sh scripts/test-security.sh
          python3 scripts/quality/maintainability.py

      - name: Prove missing release evidence blocks
        run: |
          set -euo pipefail
          if python3 scripts/release/evidence.py report --phase pre-publish --sha "${GITHUB_SHA}"; then
            echo "missing required evidence produced a false green" >&2
            exit 1
          fi

      - name: Validate agentic helper scripts
        run: |
          bash -n scripts/agentic/collect_quality_evidence.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/agentic/summarize_test_reports.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("python syntax ok")
          PY

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Run service tests
        run: go test ./backend/... -count=1

      - name: Run BPMN element matrix tests
        run: make test-bpmn-matrix

      - name: Run outbox/idempotency regression tests
        run: |
          go test ./backend/services/workflow-command/internal/application -run 'Outbox|Idempotency' -count=1
          go test ./backend/services/workflow-command/internal/infrastructure/persistence -run 'Outbox|Idempotency|TerminalFailed' -count=1
          go test ./backend/services/workflow-command/internal/interfaces/http -run 'Idempotency|Protocol|Capabilities|Metrics' -count=1
          go test ./backend/services/sync-worker/... -count=1
          go test ./backend/libs/worker -count=1

  quality-fast:
    name: Coverage, Race, and Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Enforce maintainability ratchets
        run: python3 scripts/quality/maintainability.py

      - name: Enforce calibrated coverage floors
        run: bash scripts/quality/coverage_gate.sh

      - name: Run concurrency-sensitive race targets
        run: bash scripts/quality/race.sh

      - name: Run bounded fuzz smoke
        env:
          FUZZ_TIME: 3s
        run: bash scripts/quality/fuzz.sh

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-fast-reports
          path: |
            reports/quality-coverage.json
            reports/quality-coverage.out
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  nodejs-sdk:
    name: Node.js SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/nodejs-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: clients/nodejs-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate package metadata
        run: npm run validate:package

      - name: Package dry run
        run: npm pack --dry-run


      - name: Validate clean package installation
        working-directory: .
        run: bash scripts/validate_nodejs_sdk_install.sh

      - name: Validate generated protobuf drift
        working-directory: .
        run: bash scripts/validate_generated_proto.sh

  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dotnet-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build
        run: dotnet build ArtificialFlow.Sdk.sln

      - name: Test
        run: dotnet test ArtificialFlow.Sdk.sln --no-build

      - name: Pack
        run: dotnet pack src/ArtificialFlow.Sdk/ArtificialFlow.Sdk.csproj --no-build -o artifacts

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/java-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify
        run: mvn -B verify

  migration-release-gates:
    name: ArtificialFlow Migration Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/nodejs-sdk/package-lock.json

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Install package dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix clients/nodejs-sdk ci

      - name: Run migration release gate
        run: bash scripts/validate_migration_release.sh

  docker-build:
    name: Docker Build Dry Run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: workflow-command
            dockerfile: backend/Dockerfile
            context: .
          - name: workflow-runtime
            dockerfile: backend/Dockerfile.runtime
            context: .
          - name: workflow-query
            dockerfile: backend/Dockerfile.workflow-query
            context: .
          - name: sync-worker
            dockerfile: backend/Dockerfile.sync-worker
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} --build-arg VERSION=ci --build-arg REVISION=${{ github.sha }} -t artificialflow/${{ matrix.image.name }}:ci ${{ matrix.image.context }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: artificialflow/${{ matrix.image.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose-smoke:
    name: Compose Profile Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate compose stack
        run: make smoke

      - name: Validate release compose config
        run: make smoke-release

      - name: Validate operational scripts
        run: |
          bash -n scripts/init_connector.sh
          bash -n scripts/cqrs_parity_check.sh
          bash -n scripts/cqrs_e2e_smoke.sh
          bash -n scripts/worker_conformance_smoke.sh
          bash -n scripts/validate_compose_identities.sh
          bash -n scripts/validate_helm.sh

      - name: Validate Compose identities
        run: bash scripts/validate_compose_identities.sh

      - name: Validate Helm chart
        run: bash scripts/validate_helm.sh

  cqrs-e2e-smoke:
    name: CQRS E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full CQRS E2E smoke
        env:
          CLEANUP: "true"
          WAIT_TIMEOUT_SEC: "420"
          QUERY_AUTH_MODE: off
          AUTH_ISSUER_INTERNAL_URL: ""
          AUTH_ISSUER_PUBLIC_URL: ""
          AUTH_CLIENT_ID: ""
          OIDC_TOKEN_URL: ""
          OIDC_CLIENT_ID: ""
        run: |
          chmod +x scripts/init_connector.sh scripts/cqrs_e2e_smoke.sh
          ./scripts/cqrs_e2e_smoke.sh
