{{- if .Values.gateway.enabled }}
{{- $full := include "artificialflow.fullname" . }}
{{- $oidcOrigin := "" }}
{{- if .Values.iam.mode }}
{{- $authority := urlParse (.Values.iam.frontend.oidcAuthority | default .Values.iam.auth.issuerPublicUrl) }}
{{- if or (not (has $authority.scheme (list "http" "https"))) (not (regexMatch "^[A-Za-z0-9.-]+(:[0-9]+)?$" $authority.host)) }}
{{- fail "iam.frontend.oidcAuthority (or iam.auth.issuerPublicUrl) must be an http(s) URL" }}
{{- end }}
{{- $oidcOrigin = printf " %s://%s" $authority.scheme $authority.host }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-gateway-nginx
  labels:
    {{- include "artificialflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  default.conf: |
    map $http_origin $cors_origin {
        default "";
        {{- range (splitList "," .Values.cors.allowedOrigins) }}
        {{ trim . | quote }} $http_origin;
        {{- end }}
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
    map $http_x_forwarded_proto $trusted_forwarded_proto {
        default http;
        https https;
    }
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        client_max_body_size 20m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 30s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'{{ $oidcOrigin }}; frame-src 'self'{{ $oidcOrigin }}; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        {{- if .Values.gateway.hsts.enabled }}
        add_header Strict-Transport-Security "max-age={{ int64 .Values.gateway.hsts.maxAge }}; includeSubDomains" always;
        {{- end }}
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials {{ ternary "true" "false" .Values.cors.allowCredentials | quote }} always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PUT" always;
        add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Correlation-ID,Idempotency-Key,X-Workflow-Worker-Protocol-Version" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary "Origin" always;

        # Inherited by every proxied location below.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        location = /livez {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
        location = /readyz {
            proxy_pass http://{{ $full }}-frontend:80/readyz;
        }
        location / {
            proxy_pass http://{{ $full }}-frontend:80;
            proxy_cache_bypass $http_upgrade;
        }
        location = /api/internal/metrics { return 404; }
        location = /api/v1/internal/metrics { return 404; }
        location /api/query/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_per_ip burst=40 nodelay;
            rewrite ^/api/query/(.*) /$1 break;
            proxy_pass http://{{ $full }}-query:8081;
        }
        location /api/v1/query/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_per_ip burst=40 nodelay;
            rewrite ^/api/v1/query/(.*) /v1/$1 break;
            proxy_pass http://{{ $full }}-query:8081;
        }
        location /api/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_per_ip burst=40 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://{{ $full }}-command:8080;
        }
    }
{{- end }}
