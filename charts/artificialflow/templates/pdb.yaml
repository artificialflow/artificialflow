{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component, $minAvailable := .Values.podDisruptionBudget.minAvailable }}
{{- if and $minAvailable (ge (int (index $.Values.replicaCount $component)) 2) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "artificialflow.fullname" $ }}-{{ $component }}
  labels:
    {{- include "artificialflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $minAvailable }}
  selector:
    matchLabels:
      {{- include "artificialflow.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
