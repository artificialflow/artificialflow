{{- include "artificialflow.validateValues" . -}}
{{- $v := .Values -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artificialflow.envConfigName" . }}
  labels:
    {{- include "artificialflow.labels" . | nindent 4 }}
data:
  IAM_DEPLOYMENT_MODE: {{ $v.iam.mode | quote }}
  {{- if $v.iam.mode }}
  IAM_PROVIDER_NAME: {{ $v.iam.providerName | quote }}
  AUTH_ISSUER_INTERNAL_URL: {{ $v.iam.auth.issuerInternalUrl | quote }}
  AUTH_ISSUER_PUBLIC_URL: {{ $v.iam.auth.issuerPublicUrl | quote }}
  AUTH_CLIENT_ID: {{ $v.iam.auth.clientId | quote }}
  AUTH_CLAIM_ROLES_PATH: {{ $v.iam.auth.claimRolesPath | quote }}
  AUTH_TOKEN_MODE: {{ $v.iam.auth.tokenMode | quote }}
  AUTH_INTROSPECTION_URL: {{ $v.iam.auth.introspectionUrl | quote }}
  AUTH_INTROSPECTION_CLIENT_ID: {{ $v.iam.auth.introspectionClientId | quote }}
  FRONTEND_AUTH_OIDC_AUTHORITY: {{ $v.iam.frontend.oidcAuthority | default $v.iam.auth.issuerPublicUrl | quote }}
  FRONTEND_AUTH_OIDC_CLIENT_ID: {{ $v.iam.frontend.oidcClientId | quote }}
  {{- end }}
  AUTH_PRODUCTION: {{ and $v.iam.mode $v.iam.auth.production | quote }}
  ALLOWED_ORIGINS: {{ $v.cors.allowedOrigins | quote }}
  CORS_ALLOW_CREDENTIALS: {{ $v.cors.allowCredentials | quote }}
  ES_ADDR: {{ include "artificialflow.searchAddress" . | quote }}
  KAFKA_BROKERS: {{ include "artificialflow.kafkaBrokers" . | quote }}
  KAFKA_TOPIC_EVENTS: workflow.events.v1
  KAFKA_TOPIC_PARTITIONS: {{ $v.kafka.topicPartitions | quote }}
  KAFKA_TOPICS: workflow.events.v1,artificialflow.public.process,artificialflow.public.process_instance,artificialflow.public.element_instance,artificialflow.public.variable,artificialflow.public.job,artificialflow.public.incident,artificialflow.public.timer,artificialflow.public.message_subscription
  CONNECT_URL: {{ include "artificialflow.connectUrl" . | quote }}
  CONNECTOR_DATABASE_HOSTNAME: {{ include "artificialflow.postgresHost" . | quote }}
  CONNECTOR_DATABASE_PORT: {{ $v.postgresql.port | quote }}
  CONNECTOR_DATABASE_NAME: {{ $v.postgresql.database | quote }}
  CONNECTOR_DATABASE_USER: {{ $v.postgresql.user | quote }}
  {{- range $key, $value := $v.env }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
