{{- if not .Values.postgresql.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artificialflow.envSecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "artificialflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  PG_DSN: {{ include "artificialflow.postgresDsn" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  AUTH_INTROSPECTION_CLIENT_SECRET: {{ .Values.iam.auth.introspectionClientSecret | quote }}
  {{- if not .Values.iam.mode }}
  CONSOLE_ADMIN_PASSWORD: {{ .Values.iam.consoleAdmin.password | quote }}
  {{- end }}
{{- end }}
