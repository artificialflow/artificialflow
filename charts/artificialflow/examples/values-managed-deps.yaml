# ArtificialFlow with externally managed Postgres, Elasticsearch, Kafka, and Debezium Connect.
# Copy and adapt; do not commit real secrets.
#
#   helm upgrade --install artificialflow ./charts/artificialflow \
#     -f charts/artificialflow/examples/values-managed-deps.yaml

iam:
  mode: true
  auth:
    issuerInternalUrl: https://login.example.com/realms/artificialflow
    issuerPublicUrl: https://login.example.com/realms/artificialflow
    clientId: workflow-backend
    claimRolesPath: realm_access.roles,roles
  frontend:
    oidcClientId: workflow-frontend

postgresql:
  bundled: {enabled: false}
  host: postgres.db.svc.cluster.local
  database: artificialflow
  sslMode: require
  existingSecret: artificialflow-pg # keys: PG_DSN, POSTGRES_PASSWORD (Debezium)

search:
  bundled: {enabled: false}
  address: https://es.logging.svc:9200

kafka:
  bundled: {enabled: false}
  brokers: kafka-1.msg.svc:9092,kafka-2.msg.svc:9092

connect:
  bundled: {enabled: false}
  url: http://debezium-connect.msg.svc:8083
