# ArtificialFlow: one chart, external OIDC, Kafka + Debezium CDC.
# Defaults bundle Postgres, Elasticsearch, Kafka, and Debezium Connect.
# A typical install only sets `iam.auth.*`, `ingress.host`, and `cors`.

iam:
  # true: external OIDC provider (iam.auth below is required).
  # false: no provider; local console sign-in (iam.consoleAdmin), API open.
  mode: true
  providerName: External OIDC Provider
  auth:
    issuerInternalUrl: https://login.example.com # as reached from pods
    issuerPublicUrl: https://login.example.com # token `iss`, as seen by browsers
    clientId: workflow-backend # expected audience
    claimRolesPath: roles,realm_access.roles,groups
    tokenMode: jwt # jwt | introspection
    introspectionUrl: ""
    introspectionClientId: ""
    introspectionClientSecret: ""
    production: true # applies only when mode is true
  frontend:
    oidcAuthority: "" # defaults to iam.auth.issuerPublicUrl
    oidcClientId: workflow-frontend
  # Console sign-in, rendered only when mode is false. Does not protect the API.
  # With postgresql.existingSecret, put CONSOLE_ADMIN_PASSWORD in that Secret.
  consoleAdmin:
    username: admin
    password: admin

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: app.artificialflow.example.io
  tls: {enabled: true, secretName: artificialflow-tls}

cors:
  allowedOrigins: https://app.artificialflow.example.io # exact comma-separated allowlist
  allowCredentials: false

# Extra environment for every ArtificialFlow service (for example
# TENANT_MODE, AUTH_ENFORCE_AUDIENCE, LOG_LEVEL, CONNECTOR_JSON).
# Unset keys keep the service defaults listed in docs/deployment.md.
env: {}

# Each image also accepts `digest: sha256:...` and `pullPolicy`.
images:
  command:
    repository: artificialflow/workflow-command
    tag: "1.2.0"
  query:
    repository: artificialflow/workflow-query
    tag: "1.2.0"
  runtime:
    repository: artificialflow/workflow-runtime
    tag: "1.2.0"
  syncWorker:
    repository: artificialflow/sync-worker
    tag: "1.2.0"
  frontend:
    repository: artificialflow/frontend
    tag: "1.2.0"
  gateway:
    repository: nginxinc/nginx-unprivileged
    tag: "1.31.7-alpine"

replicaCount: {command: 2, query: 2, runtime: 1, syncWorker: 1, frontend: 2, gateway: 2}

# Per-component `env` maps are added to that container only.
command:
  env: {}
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1000m, memory: 512Mi}}
query:
  env: {}
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1000m, memory: 512Mi}}
runtime:
  enabled: true
  schedulerMode: compat # multi-active with replicaCount.runtime=3 for HA
  env: {}
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1000m, memory: 512Mi}}
syncWorker:
  enabled: true
  env: {}
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1000m, memory: 512Mi}}
frontend:
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
gateway:
  enabled: true
  serviceType: ClusterIP
  # HSTS requires TLS at the ingress (ingress.enabled and ingress.tls.enabled).
  hsts: {enabled: true, maxAge: 31536000}
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}

# --- Data plane: bundled by default; set bundled.enabled=false to use managed services ---
postgresql:
  bundled:
    enabled: true
    image: {repository: postgres, tag: 15.19-alpine}
    size: 20Gi
    storageClassName: ""
    # Extra postgres -c settings, for example max_wal_size=4GB. Empty keeps the chart defaults.
    parameters: []
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
  host: "" # required when not bundled (or set dsn)
  port: 5432
  database: workflow_db
  user: artificialflow
  password: change-me
  sslMode: require # bundled always uses disable
  dsn: ""
  # Secret with PG_DSN (and POSTGRES_PASSWORD / AUTH_INTROSPECTION_CLIENT_SECRET when used).
  existingSecret: ""
  existingSecretKey: PG_DSN

search:
  bundled:
    enabled: true
    image: {repository: docker.elastic.co/elasticsearch/elasticsearch, tag: "8.19.23"}
    javaOpts: -Xms512m -Xmx512m
    size: 20Gi
    storageClassName: ""
    resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: 2000m, memory: 2Gi}}
  address: "" # required when not bundled

kafka:
  # Partitions for topics created by sync-worker or auto-created by the bundled broker.
  # Sync-worker replicas beyond this count sit idle; existing topics are not resized.
  topicPartitions: 3
  bundled:
    enabled: true
    image: {repository: apache/kafka, tag: "4.4.0"}
    size: 20Gi
    storageClassName: ""
    resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: 2000m, memory: 2Gi}}
  brokers: "" # required when not bundled

connect:
  bundled:
    enabled: true
    image: {repository: debezium/connect, tag: "3.0.0.Final"}
    resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: 2000m, memory: 2Gi}}
  url: "" # required when not bundled

# Command and runtime apply the embedded schema migrations at startup under a
# Postgres advisory lock; the chart has no separate migration Job.
startupProbe:
  # Window for migrations before liveness checks begin: periodSeconds x failureThreshold.
  periodSeconds: 5
  failureThreshold: 120

# --- Production hardening ---
# PDBs apply only to components running at least 2 replicas.
podDisruptionBudget:
  enabled: true
  minAvailable: {command: 1, query: 1, runtime: 2, frontend: 1, gateway: 1}

autoscaling:
  enabled: false
  components: [command, query, frontend, gateway]
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Default-deny policies. Endpoints outside the namespace need explicit CIDRs.
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  external:
    postgresqlCIDRs: []
    brokerCIDRs: []
    searchCIDRs: []
    iamCIDRs: []
    telemetryCIDRs: []

# Opt-in Prometheus Operator + Grafana resources. Metrics stay cluster-private.
monitoring:
  enabled: false
  serviceMonitor: {enabled: true, interval: 30s, scrapeTimeout: 10s, additionalLabels: {}}
  prometheusRule:
    enabled: true
    additionalLabels: {}
    runbookBaseUrl: https://github.com/artificialflow/artificialflow/blob/main/docs/operations.md
  grafanaDashboard: {enabled: true, label: grafana_dashboard, labelValue: "1"}

# --- Kubernetes plumbing ---
serviceAccount:
  create: true
  name: ""
  annotations: {}

global:
  imagePullSecrets: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}

nameOverride: ""
fullnameOverride: ""

# Only for in-place upgrades of the former chart; fresh installs keep this disabled.
compatibility:
  legacyResourceNames:
    enabled: false
    fullnameOverride: ""
    selectorNameOverride: ""
    selectorInstanceOverride: ""
